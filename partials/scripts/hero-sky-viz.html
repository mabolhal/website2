<script>
/* ===== HERO SKY VIZ ===== */
(function(){
  const PHASES = {
    sunrise:{label:'SUNRISE', t:.14, stars:0,
      sky:[[255,209,176],[255,231,205],[244,244,241]], body:[255,138,76]},
    noon:{label:'NOON', t:.50, stars:0,
      sky:[[212,234,240],[234,242,243],[244,244,241]], body:[246,214,110]},
    sunset:{label:'SUNSET', t:.88, stars:.06,
      sky:[[240,155,110],[255,199,150],[244,233,224]], body:[255,104,58]},
    night:{label:'NIGHT', t:.42, stars:1,
      sky:[[12,15,30],[20,26,52],[38,44,76]], body:[228,232,246]}
  };
  const ORDER = ['sunrise','noon','sunset','night'];

  const hero = document.querySelector('.hero');
  const canvas = hero.querySelector('.data-viz__canvas');
  const ctx = canvas.getContext('2d');
  const trigger = hero.querySelector('.time-of-day-select__trigger');
  const valueEl = hero.querySelector('.time-of-day-select__value');
  const list = hero.querySelector('.time-of-day-select__list');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function phaseFromTime(){
    const h = new Date().getHours();
    if(h >= 5 && h < 10) return 'sunrise';
    if(h >= 10 && h < 16) return 'noon';
    if(h >= 16 && h < 20) return 'sunset';
    return 'night';
  }

  // Set initial theme based on time of day
  const initialPhase = phaseFromTime();
  // Theme already set by the inline script, but keep for consistency
  document.documentElement.dataset.theme = initialPhase;

  let target = PHASES[initialPhase];
  const state = { t:target.t, stars:target.stars,
    sky:target.sky.map(c=>c.slice()), body:target.body.slice() };
  function lerp(a,b,k){ return a + (b-a)*k; }

  let stars = [];
  function seedStars(){
    stars = [];
    for(let i=0;i<140;i++){
      stars.push({x:Math.random(), y:Math.random()*0.62, r:Math.random()*1.2+.35,
        p:Math.random()*Math.PI*2, s:0.5+Math.random()*2.2, tw:0.4+Math.random()*1.6, cross:Math.random()<0.15});
    }
  }
  seedStars();

  function resize(){
    canvas.width = canvas.offsetWidth * devicePixelRatio;
    canvas.height = canvas.offsetHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize();
  addEventListener('resize', resize);

  function drawRays(bx,by,r,time,isNoon,isSunset){
    const tt = time*0.001;
    if(isNoon){
      // --- NOON: steady rays emanating from sphere, slowly rotating, NO twinkle ---
      const COUNT = 28;
      ctx.save();
      ctx.translate(bx,by);
      ctx.rotate(tt*0.05); // slow steady rotation = movement
      for(let i=0;i<COUNT;i++){
        const isMajor = i%2===0;
        const ang = (i/COUNT)*Math.PI*2;
        const baseLen = isMajor ? r*3.6 : r*2.1;
        const op = isMajor ? 0.32 : 0.14;
        ctx.save();
        ctx.rotate(ang);
        const x0 = r*0.94;
        const x1 = x0 + baseLen;
        const grad = ctx.createLinearGradient(x0,0,x1,0);
        grad.addColorStop(0, `rgba(255,252,210,${op})`);
        grad.addColorStop(0.22, `rgba(255,240,130,${op*0.85})`);
        grad.addColorStop(0.6, `rgba(246,214,110,${op*0.25})`);
        grad.addColorStop(1, `rgba(246,214,110,0)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = isMajor ? 1.15 : 0.65;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x1, 0);
        ctx.stroke();
        ctx.restore();
      }
      const corona = ctx.createRadialGradient(0,0,r*0.9, 0,0,r*4.2);
      corona.addColorStop(0, `rgba(255,250,185,0.16)`);
      corona.addColorStop(0.35, `rgba(255,235,110,0.06)`);
      corona.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = corona;
      ctx.beginPath(); ctx.arc(0,0,r*4.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }
    // sunrise / sunset quiet rays
    const count = 10;
    ctx.save();
    ctx.translate(bx,by);
    for(let i=0;i<count;i++){
      const ang = (i/count)*Math.PI*2;
      ctx.save(); ctx.rotate(ang);
      ctx.strokeStyle = isSunset ? 'rgba(255,140,80,0.16)' : 'rgba(255,210,160,0.12)';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(r*1.05,0); ctx.lineTo(r*1.05 + r*1.6,0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function draw(time){
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    ctx.clearRect(0,0,W,H);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, 'rgb('+state.sky[0].map(Math.round).join(',')+')');
    g.addColorStop(0.55, 'rgb('+state.sky[1].map(Math.round).join(',')+')');
    g.addColorStop(1, 'rgb('+state.sky[2].map(Math.round).join(',')+')');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const x0 = W*0.06, x1 = W*0.94, cx = W/2;
    const horizon = H*0.88, apex = H*0.16;
    const waterTop = H*0.68;
    const t = state.t;
    const bx = x0 + (x1-x0)*t;
    const by = horizon - Math.sin(Math.PI*Math.min(1,Math.max(0,t))) * (horizon - apex) * 0.94;
    const isNight = target === PHASES.night;
    const isNoon = target === PHASES.noon;
    const isSunset = target === PHASES.sunset;
    const r = Math.max(14, Math.min(W,H) * 0.035);

    if(isSunset){
      const tt = time*0.001;
      const wg = ctx.createLinearGradient(0, waterTop, 0, H);
      wg.addColorStop(0, 'rgba(68,52,84,0.85)');
      wg.addColorStop(0.35, 'rgba(36,32,62,0.92)');
      wg.addColorStop(1, 'rgba(18,20,42,1)');
      ctx.fillStyle = wg;
      ctx.fillRect(0, waterTop, W, H-waterTop);

      const rg = ctx.createLinearGradient(0, waterTop, 0, H);
      rg.addColorStop(0, 'rgba(255,160,95,0.45)');
      rg.addColorStop(0.25, 'rgba(255,120,65,0.22)');
      rg.addColorStop(0.6, 'rgba(255,100,60,0.08)');
      rg.addColorStop(1, 'rgba(30,20,50,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(bx - r*1.4, waterTop);
      ctx.lineTo(bx + r*1.4, waterTop);
      ctx.lineTo(bx + r*0.5, H);
      ctx.lineTo(bx - r*0.5, H);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      for(let j=0;j<3;j++){
        const layerOp = j===0 ? 0.28 : j===1 ? 0.18 : 0.12;
        const amp = j===0 ? 5 : j===1 ? 8 : 11;
        const speed = 0.8 + j*0.35;
        const freq = 0.018 + j*0.008;
        ctx.strokeStyle = `rgba(255,${170-j*10},${110+j*15},${layerOp})`;
        ctx.lineWidth = j===0 ? 1.1 : 0.6;
        for(let i=0;i<28;i++){
          const yy = waterTop + (H-waterTop)*(0.06 + i/28*0.9);
          const xOff = Math.sin(tt*speed + i*0.6 + j)*amp*1.2;
          const w = W * (0.22 + (1-(yy-waterTop)/(H-waterTop))*0.55);
          const cxWave = bx + xOff;
          ctx.beginPath();
          ctx.moveTo(cxWave - w/2, yy);
          for(let x=-w/2; x<w/2; x+=12){
            const wy = yy + Math.sin((x+tt*40)*freq + i)*1.4;
            const wx = cxWave + x + Math.sin(x*0.08 + tt*1.5 + j)*1.5;
            ctx.lineTo(wx, wy);
          }
          ctx.stroke();
        }
      }
      ctx.restore();

      for(let k=0;k<55;k++){
        const px = ((k*73 + tt*30 + Math.sin(k)*100) % (W*1.4)) - W*0.2;
        const dx = (px - bx)/(W*0.42);
        if(Math.abs(dx) > 1) continue;
        const py = waterTop + (0.12 + (k%7)/7*0.82)*(H-waterTop) + Math.sin(tt*1.2+k)*3;
        const blink = Math.pow(Math.max(0, Math.sin(tt*1.8 + k*1.1)), 3.5);
        const a = (0.12 + blink*0.72)*(1-Math.abs(dx)*0.6);
        if(a<0.02) continue;
        ctx.fillStyle = `rgba(255,235,185,${a})`;
        ctx.beginPath(); ctx.arc(px, py, 0.8 + blink*1.6, 0, Math.PI*2); ctx.fill();
      }

      ctx.strokeStyle = 'rgba(255,160,90,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, waterTop);
      for(let x=0;x<W;x+=10){
        ctx.lineTo(x, waterTop + Math.sin(x*0.02 + tt*2.2)*1.8 + Math.sin(x*0.01+tt)*1.2);
      }
      ctx.stroke();
    }

    if(state.stars > 0.01){
      const tt = time*0.001;
      for(const st of stars){
        const tw = 0.5 + 0.5*Math.sin(tt*st.tw + st.p)*Math.sin(tt*st.s*0.7 + st.p);
        const a = state.stars * (0.15 + 0.85*Math.max(0,tw));
        if(a<0.02) continue;
        const x = st.x*W, y = st.y*H;
        const rr = st.r*(0.6 + tw*0.9);
        ctx.fillStyle = `rgba(235,238,250,${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
        if(st.cross && tw>0.75){
          ctx.strokeStyle = `rgba(235,238,250,${(a*0.45).toFixed(3)})`;
          ctx.lineWidth = 0.6;
          const l = rr*2.6;
          ctx.beginPath(); ctx.moveTo(x-l,y); ctx.lineTo(x+l,y); ctx.moveTo(x,y-l); ctx.lineTo(x,y+l); ctx.stroke();
        }
      }
    }

    if(!isSunset){
      ctx.strokeStyle = 'rgba(120,120,115,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0, horizon);
      ctx.quadraticCurveTo(cx, horizon - (horizon-apex)*2, x1, horizon);
      ctx.stroke();
    }

    if(isNight){
      ctx.fillStyle = 'rgb('+state.body.map(Math.round).join(',')+')';
      ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation='destination-out';
      ctx.beginPath(); ctx.arc(bx - r*0.45, by - r*0.18, r*0.86,0,Math.PI*2); ctx.fill(); ctx.restore();
      const mg = ctx.createRadialGradient(bx,by,r, bx,by,r*3);
      mg.addColorStop(0,'rgba(230,235,255,0.18)'); mg.addColorStop(1,'rgba(230,235,255,0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(bx,by,r*3,0,Math.PI*2); ctx.fill();
    } else {
      drawRays(bx,by,r,time,isNoon,isSunset);
      if(isNoon){
        const glow = ctx.createRadialGradient(bx,by,r*0.8, bx,by,r*2.8);
        glow.addColorStop(0,'rgba(255,240,160,0.28)');
        glow.addColorStop(1,'rgba(255,240,160,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(bx,by,r*2.8,0,Math.PI*2); ctx.fill();
      } else if(isSunset){
        const glow = ctx.createRadialGradient(bx,by,r*0.6, bx,by,r*4);
        glow.addColorStop(0,'rgba(255,120,60,0.38)');
        glow.addColorStop(1,'rgba(255,120,60,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(bx,by,r*4,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = 'rgb('+state.body.map(Math.round).join(',')+')';
      ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
      if(isNoon){
        const hg = ctx.createRadialGradient(bx - r*0.25, by - r*0.25, r*0.1, bx,by,r);
        hg.addColorStop(0,'rgba(255,255,220,0.9)');
        hg.addColorStop(0.3,'rgba(255,255,220,0)');
        ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
      }
    }

    const k = reduceMotion ? 1 : 0.038;
    state.t = lerp(state.t, target.t, k);
    state.stars = lerp(state.stars, target.stars, k);
    for(let i=0;i<3;i++) for(let j=0;j<3;j++) state.sky[i][j] = lerp(state.sky[i][j], target.sky[i][j], k);
    for(let j=0;j<3;j++) state.body[j] = lerp(state.body[j], target.body[j], k);
  }

  if(reduceMotion){ draw(0); }
  else { (function loop(t){ draw(t||0); requestAnimationFrame(loop); })(0); }

  ORDER.forEach(id => {
    const li = document.createElement('li');
    li.textContent = PHASES[id].label;
    li.setAttribute('role','option');
    li.dataset.value = id;
    li.addEventListener('click', () => { select(id); closeList(); });
    list.appendChild(li);
  });

  function select(id){
    target = PHASES[id];
    trigger.dataset.value = id;
    valueEl.textContent = target.label;
    trigger.setAttribute('aria-label', target.label + '. Choose a time of day');
    document.documentElement.dataset.theme = id;
    const sunGroup = trigger.querySelector('.time-of-day-select-icon__sun-group');
    const moon = trigger.querySelector('.time-of-day-select-icon__moon');
    if(sunGroup && moon){
      sunGroup.style.opacity = id === 'night' ? '.2' : '1';
      moon.style.opacity = id === 'night' ? '1' : '.2';
    }
    list.querySelectorAll('li').forEach(li =>
      li.setAttribute('aria-selected', li.dataset.value === id ? 'true' : 'false'));
  }
  function openList(){ list.classList.add('open'); trigger.setAttribute('aria-expanded','true'); }
  function closeList(){ list.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); }

  trigger.addEventListener('click', () => { list.classList.contains('open') ? closeList() : openList(); });
  trigger.addEventListener('keydown', e => {
    const i = ORDER.indexOf(trigger.dataset.value);
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const n = ORDER[(i + (e.key === 'ArrowDown' ? 1 : ORDER.length - 1)) % ORDER.length];
      select(n);
    } else if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); list.classList.contains('open') ? closeList() : openList(); }
    else if(e.key === 'Escape'){ closeList(); }
  });
  document.addEventListener('click', e => { if(!e.target.closest('.time-of-day-select')) closeList(); });

  // Set initial state for the UI
  select(initialPhase);
})();
</script>
